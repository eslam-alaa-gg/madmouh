<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F6F3">
<title>MAMDOUH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
<symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</g></svg>

<main>
<section class="view" id="home">
  <div class="glass hero">
    <img class="arch" src="img/photo.jpg" alt="صورة" width="368" height="716">
    <h1>MAMDOUH</h1>
    <p>أدعية وأذكار وسبحة إلكترونية، نسأل الله أن يجعلها صدقة جارية.</p>
    <div class="row">
      <a class="btn dark" href="#tasbeeh"><svg class="i"><use href="#i-dot"/></svg>ابدأ التسبيح</a>
      <a class="btn" href="#duas"><svg class="i"><use href="#i-book"/></svg>دعاء اليوم</a>
    </div>
  </div>
</section>

<section class="view" id="duas">
  <div class="glass dua" id="d-card">
    <p class="dua-text" id="d-text" aria-live="polite"></p>
    <p class="muted" id="d-src"></p>
    <div class="dua-foot">
      <span class="muted" id="d-idx"></span>
      <span class="row">
        <button class="icon" id="d-copy" aria-label="نسخ الدعاء"><svg class="i"><use href="#i-copy"/></svg></button>
        <button class="icon" id="d-share" aria-label="مشاركة الدعاء"><svg class="i"><use href="#i-share"/></svg></button>
      </span>
    </div>
  </div>
  <div class="center"><button class="btn dark big" id="d-next"><svg class="i"><use href="#i-refresh"/></svg>دعاء آخر</button></div>
  <div class="glass err" id="d-err" hidden><p>تعذّر تحميل الأدعية. تأكد من الاتصال ثم حاول مرة أخرى.</p><button class="btn" id="d-retry">إعادة المحاولة</button></div>
</section>

<section class="view" id="tasbeeh">
  <div class="glass tas">
    <p class="dhikr" id="t-text" aria-live="polite"></p>
    <p class="muted" id="t-combo" hidden></p>
    <div class="count" id="t-count">0</div>
    <p class="muted" id="t-of"></p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="t-bar"></i></div>
    <p class="note" id="t-note"></p>
  </div>
  <div class="center"><button class="tap" id="t-tap" aria-label="سبّح"><svg class="i"><use href="#i-dot"/></svg></button></div>
  <div class="chips" id="t-goals"></div>
  <div class="row custom" id="t-custom" hidden><input type="number" inputmode="numeric" min="1" max="100000" id="t-cin" placeholder="العدد"><button class="btn dark" id="t-cset">تعيين</button></div>
  <div class="row center"><button class="btn" id="t-reset"><svg class="i"><use href="#i-reset"/></svg>إعادة تعيين</button><button class="btn" id="t-pick"><svg class="i"><use href="#i-list"/></svg>اختيار ذكر آخر</button></div>
</section>
</main>

<nav class="nav" aria-label="التنقل">
  <a href="#home" data-v="home"><svg class="i"><use href="#i-home"/></svg><span>الرئيسية</span></a>
  <a href="#duas" data-v="duas"><svg class="i"><use href="#i-book"/></svg><span>الأدعية</span></a>
  <a href="#tasbeeh" data-v="tasbeeh"><svg class="i"><use href="#i-dot"/></svg><span>السبحة</span></a>
</nav>

<dialog id="sheet"><div class="sheet-h"><b>اختيار الذكر</b><button class="icon" id="s-close" aria-label="إغلاق"><svg class="i"><use href="#i-x"/></svg></button></div><div id="s-body"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="js/app.js"></script>
<script src="js/duas.js"></script>
<script src="js/tasbeeh.js"></script>
</body>
</html>
